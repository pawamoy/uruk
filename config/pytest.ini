[pytest]
python_files =
  test_*.py
addopts =
  --cov
  --cov-config config/coverage.ini
testpaths =
  tests

# action:message_regex:warning_class:module_regex:line
filterwarnings =
  error
  default::EncodingWarning
  error::EncodingWarning:uruk
  # pypiserver's bundled Bottle triggers these warnings on older Python versions.
  ignore:_ImportRedirect\.find_spec\(\) not found:ImportWarning
  ignore:'cgi' is deprecated and slated for removal in Python 3\.13:DeprecationWarning:pypiserver\.bottle_wrapper\.bottle
  # TODO: remove once pytest-xdist 4 is released
  ignore:.*rsyncdir:DeprecationWarning:xdist
