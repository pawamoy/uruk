[project]
name = "uruk"
version = "0.1.0"
description = "Telegram bot to drive Claude Code and OpenAI Codex sessions from your phone."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1",
    "insiders",
    "loguru>=0.7",
    "openai-codex>=0.144.4",
    "python-telegram-bot>=21.0",
    "telegramify-markdown>=1.2.0",
]

[project.scripts]
uruk = "uruk:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uruk"]
